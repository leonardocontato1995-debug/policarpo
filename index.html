<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Mobile 2026</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #2c3e50; color: white; font-family: sans-serif; flex-direction: column; overflow: hidden; }
        canvas { border: 3px solid #fff; background: #000; max-width: 90vw; max-height: 45vh; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        button { width: 70px; height: 70px; font-size: 25px; font-weight: bold; border-radius: 15px; border: none; background: #ecf0f1; color: #2c3e50; touch-action: manipulation; }
        .up { grid-column: 2; }
        .left { grid-column: 1; }
        .down { grid-column: 2; }
        .right { grid-column: 3; }
        h3 { margin: 10px 0; }
    </style>
</head>
<body>
    <h3>Score: <span id="scoreVal">0</span></h3>
    <canvas id="snake" width="400" height="400"></canvas>
    
    <div class="controls">
        <button class="up" onclick="changeDir('UP')">↑</button>
        <button class="left" onclick="changeDir('LEFT')">←</button>
        <button class="down" onclick="changeDir('DOWN')">↓</button>
        <button class="right" onclick="changeDir('RIGHT')">→</button>
    </div>

    <script>
        const canvas = document.getElementById("snake");
        const ctx = canvas.getContext("2d");
        const box = 20;
        let snake = [{ x: 9 * box, y: 10 * box }];
        let direction = "RIGHT";
        let food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };
        let score = 0;

        function changeDir(newDir) {
            if(newDir == "LEFT" && direction != "RIGHT") direction = "LEFT";
            if(newDir == "UP" && direction != "DOWN") direction = "UP";
            if(newDir == "RIGHT" && direction != "LEFT") direction = "RIGHT";
            if(newDir == "DOWN" && direction != "UP") direction = "DOWN";
        }

        // Suporte para teclado também
        document.addEventListener("keydown", (e) => {
            if(e.keyCode == 37) changeDir("LEFT");
            if(e.keyCode == 38) changeDir("UP");
            if(e.keyCode == 39) changeDir("RIGHT");
            if(e.keyCode == 40) changeDir("DOWN");
        });

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for(let i=0; i<snake.length; i++){
                ctx.fillStyle = (i==0) ? "#2ecc71" : "#27ae60";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "black";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(food.x, food.y, box, box);

            let sX = snake[0].x;
            let sY = snake[0].y;

            if(direction == "LEFT") sX -= box;
            if(direction == "UP") sY -= box;
            if(direction == "RIGHT") sX += box;
            if(direction == "DOWN") sY += box;

            if(sX == food.x && sY == food.y){
                score++;
                document.getElementById("scoreVal").innerHTML = score;
                food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };
            } else {
                snake.pop();
            }

            let nH = { x: sX, y: sY };

            if(sX < 0 || sX >= canvas.width || sY < 0 || sY >= canvas.height || snake.some(s => s.x == nH.x && s.y == nH.y)){
                clearInterval(game);
                alert("Fim de Jogo! Score: " + score);
                location.reload();
            }
            snake.unshift(nH);
        }

        let game = setInterval(draw, 150);
    </script>
</body>
</html>
