<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo Wireframe 3D</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            perspective: 1000px;
            overflow: hidden;
        }

        .scene {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: girar 8s linear infinite;
        }

        /* Estilo das faces (apenas as bordas) */
        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid #00ffcc; /* Cor Neon */
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); /* Brilho sutil */
            background: transparent; /* Sem preenchimento */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Posicionamento das faces no espaço 3D */
        .front  { transform: rotateY(0deg) translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        /* Animação de rotação */
        @keyframes girar {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to   { transform: rotateX(360deg) rotateY(360deg); }
        }

        h1 {
            position: absolute;
            top: 20px;
            color: #00ffcc;
            font-family: monospace;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <h1>3D_WIREFRAME</h1>

    <div class="scene">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
    </div>

</body>
</html>
