<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donut 3D CSS - 2026</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            perspective: 1000px; /* Cria o efeito de profundidade 3D */
            overflow: hidden;
        }

        .donut-container {
            position: relative;
            width: 200px;
            height: 200px;
            transform-style: preserve-3d;
            animation: rotate3D 5s linear infinite;
        }

        /* Criando o "corpo" do donut com sombras e bordas arredondadas */
        .donut {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 40px solid #ff69b4; /* Cor da cobertura (Rosa) */
            box-sizing: border-box;
            box-shadow: 
                0 0 20px rgba(0,0,0,0.5),
                inset 0 0 15px #e03a8d;
        }

        /* Adicionando camadas para dar volume */
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 40px solid #ff85c1;
            box-sizing: border-box;
            transform: translateZ(10px);
        }

        .layer:nth-child(2) { transform: translateZ(-10px); border-color: #d15694; }
        .layer:nth-child(3) { transform: rotateY(90deg); border-color: #f0a0c9; }
        .layer:nth-child(4) { transform: rotateX(90deg); border-color: #c44e89; }

        /* Animação de rotação em todos os eixos */
        @keyframes rotate3D {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        h2 {
            position: absolute;
            top: 20px;
            color: #ff69b4;
            font-family: 'Arial', sans-serif;
            text-shadow: 0 0 10px rgba(255,105,180,0.5);
        }
    </style>
</head>
<body>

    <h2>CSS 3D Donut - 2026</h2>

    <div class="donut-container">
        <div class="donut"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
    </div>

</body>
</html>
